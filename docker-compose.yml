services:
  # frontend-prod:
  #   container_name: eg-frontend-prod
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend

  frontend-dev:
    container_name: eg-frontend-dev
    build:
      context: ./frontend
      dockerfile: Development.Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - 5173:5173
    depends_on:
      - backend

  backend:
    container_name: eg-backend
    build:
      context: ./backend
      dockerfile: Development.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FRONTEND_URL=http://frontend:80
      - PORT=5000
      - DB_CONNECTION_STRING=mongodb://admin:admin@eg-db:27017/myapp?authSource=admin
      - PASSWORD_SALT=acfe4d0752b66cedfb5ab6d23e47621f
      - JWT_SECRET=your_jwt_secret_key
      - JWT_EXPIRES_IN=1h
    volumes:
      - ./backend:/app
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # docs:
  #   container_name: eg-docs
  #   build:
  #     context: ./docs
  #     dockerfile: Dockerfile
  #   volumes:
  #     - ./docs:/app
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

  db:
    image: mongo:latest
    container_name: eg-db
    ports:
      - "27017:27017"
    volumes:
      - ./db-data:/data/db
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--eval",
          "db.runCommand('ping').ok",
          "localhost:27017/myapp",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
