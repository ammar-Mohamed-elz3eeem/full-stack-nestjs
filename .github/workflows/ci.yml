name: CI - Test & Lint
on: push
env:
  NODE_VERSION: "20"
jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./backend
        run: pnpm lint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: mongoadmin
          MONGO_INITDB_ROOT_PASSWORD: secret
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ./backend
        env:
          DB_CONNECTION_STRING: mongodb://mongoadmin:secret@localhost:27017/test?authSource=admin
          PASSWORD_SALT: test_salt_for_ci
          JWT_SECRET: test_jwt_secret_for_ci
          JWT_EXPIRES_IN: 1h
          PORT: 3000
          FRONTEND_URL: http://localhost:3000
        run: pnpm test

      - name: Run e2e tests
        working-directory: ./backend
        env:
          DB_CONNECTION_STRING: mongodb://mongoadmin:secret@localhost:27017/test_e2e?authSource=admin
          PASSWORD_SALT: test_salt_for_ci
          JWT_SECRET: test_jwt_secret_for_ci
          JWT_EXPIRES_IN: 1h
          PORT: 3000
          FRONTEND_URL: http://localhost:3000
        run: pnpm test:e2e

  lint-build-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./frontend
        run: pnpm lint

      - name: Run Build
        working-directory: ./frontend
        run: pnpm build
